<template>
    <lightning-card title="Products" icon-name="standard:product">
        <template if:true={products}>
            <lightning-datatable
                key-field="Id"
                data={products}
                columns={columns}>
            </lightning-datatable>
        </template>
        <template if:true={error}>
            <div class="slds-text-color_error">{error}</div>
        </template>
    </lightning-card>
</template>
