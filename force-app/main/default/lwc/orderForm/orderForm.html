<template>
    <lightning-card title="Create Partner Order" icon-name="standard:order">
        <div class="slds-p-around_medium">
            <lightning-combobox
                name="product"
                label="Select Product"
                placeholder="Select a product"
                options={productsOptions}
                value={selectedProductId}
                onchange={handleProductChange}>
            </lightning-combobox>

            <lightning-input
                type="number"
                label="Quantity"
                value={quantity}
                min="1"
                onchange={handleQuantityChange}>
            </lightning-input>

            <lightning-button
                label="Submit Order"
                variant="brand"
                onclick={handleSubmit}>
            </lightning-button>

            <template if:true={message}>
                <div class="slds-m-top_small">{message}</div>
            </template>
        </div>
    </lightning-card>
</template>
